<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141220" />
    <meta name="description" content="A governance simulation sandbox for Designated Lunar Area policy regimes. Open Lunar Foundation fellowship deliverable." />
    <title>Overlap · a lunar policy sandbox · Open Lunar Foundation</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><defs><radialGradient id='m' cx='0.35' cy='0.35'><stop offset='0%25' stop-color='%23ECEAF8' stop-opacity='0.95'/><stop offset='100%25' stop-color='%23A8A8F0' stop-opacity='0.65'/></radialGradient></defs><rect width='22' height='22' fill='%23141220'/><circle cx='11' cy='11' r='9' fill='url(%23m)'/><circle cx='14.5' cy='9.5' r='8.5' fill='%23141220'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,600&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        /* ── "The Both" palette ─────────────────────────────────── */
        --slate-night:    #141220;
        --deep-slate:     #201E40;
        --instrument:     #3460A8;
        --mist:           #80B0D8;
        --periwinkle:     #A8A8F0;
        --blue-lavender:  #C0B8E8;
        --deep-violet:    #2E2068;
        --whisper:        #ECEAF8;
        --silver:         #C8C4DC;

        /* ── Functional roles ───────────────────────────────────── */
        --bg-deepest:     #0B0918;
        --bg-base:        #141220;
        --bg-panel:       rgba(32, 30, 64, 0.55);
        --bg-panel-solid: #1B1934;
        --bg-elevated:    rgba(168, 168, 240, 0.06);

        --border-faint:   rgba(200, 196, 220, 0.08);
        --border-soft:    rgba(200, 196, 220, 0.14);
        --border-strong:  rgba(168, 168, 240, 0.35);

        --text-dim:       #5A567A;
        --text-mid:       #8B86B0;
        --text-bright:    #C8C4DC;
        --text-hi:        #ECEAF8;

        /* ── Player & semantic colors ──────────────────────────── */
        --p1: #28B9AE;          /* Teal, Player 1 (Actor I) */
        --p1-soft: rgba(40,185,174,0.15);
        --p1-glow: rgba(40,185,174,0.45);

        --p2: #F0902E;          /* Orange, Player 2 (Actor II) */
        --p2-soft: rgba(240,144,46,0.15);
        --p2-glow: rgba(240,144,46,0.45);

        --accent: #C0B8E8;      /* Blue-Lavender, neutral accent */
        --accent-soft: rgba(192,184,232,0.10);

        --instrument-soft: rgba(52,96,168,0.18);
        --instrument-glow: rgba(52,96,168,0.45);

        --danger: #E89BB5;
        --danger-soft: rgba(232,155,181,0.14);
        --warning: #E8C998;
        --warning-soft: rgba(232,201,152,0.14);
        --success: #9BD4B5;
        --success-soft: rgba(155,212,181,0.14);

        /* ── Typography ─────────────────────────────────────────── */
        --serif:   'Spectral', 'Iowan Old Style', Georgia, serif;
        --sans:    'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono:    'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
        --display: 'Spectral', 'Iowan Old Style', Georgia, serif;

        /* ── v22: Mission-ops accents ──────────────────────────── */
        --phosphor:       #7DD8B0;   /* terminal green */
        --phosphor-soft:  rgba(125, 216, 176, 0.14);
        --phosphor-glow:  rgba(125, 216, 176, 0.45);
        --amber-term:     #FFB870;   /* aviation amber */
        --amber-soft:     rgba(255, 184, 112, 0.14);
        --ops-grid:       rgba(168, 168, 240, 0.06);
        --ops-grid-major: rgba(168, 168, 240, 0.10);
      }

      html, body {
        background: var(--bg-base);
        color: var(--text-bright);
        font-family: var(--sans);
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        background:
          radial-gradient(ellipse at 15% 0%, rgba(46,32,104,0.35) 0%, transparent 55%),
          radial-gradient(ellipse at 85% 100%, rgba(52,96,168,0.18) 0%, transparent 50%),
          var(--bg-base);
        min-height: 100vh;
      }

      /* Subtle grain overlay for editorial texture */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        opacity: 0.035;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
      }

      #root { position: relative; z-index: 2; }

      /* ── Scrollbar ─────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(168, 168, 240, 0.18);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(168, 168, 240, 0.35); }

      /* ── Buttons & inputs ──────────────────────────────────── */
      button {
        transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
        font-family: var(--sans);
        font-weight: 500;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.18) saturate(1.1);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      input, select, textarea { font-family: var(--sans); }

      input[type="range"] {
        height: 4px;
        border-radius: 2px;
        appearance: none;
        -webkit-appearance: none;
        background: rgba(168, 168, 240, 0.12);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--periwinkle);
        cursor: pointer;
        box-shadow:
          0 0 0 3px rgba(168, 168, 240, 0.18),
          0 0 12px rgba(168, 168, 240, 0.55);
        border: none;
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--periwinkle);
        cursor: pointer;
        box-shadow: 0 0 0 3px rgba(168, 168, 240, 0.18), 0 0 12px rgba(168, 168, 240, 0.55);
        border: none;
      }

      select {
        transition: border-color 0.18s, background 0.18s;
        background: var(--bg-panel-solid) !important;
      }
      select:hover {
        border-color: var(--border-strong) !important;
      }
      select option {
        background: var(--bg-panel-solid);
        color: var(--text-bright);
      }

      /* ── Animations ─────────────────────────────────────────── */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 10px rgba(168,168,240,0.25), inset 0 0 0 1px rgba(168,168,240,0.35); }
        50%      { box-shadow: 0 0 24px rgba(168,168,240,0.55), inset 0 0 0 1px rgba(168,168,240,0.6); }
      }
      @keyframes pulse-glow-p2 {
        0%, 100% { box-shadow: 0 0 10px rgba(128,176,216,0.25), inset 0 0 0 1px rgba(128,176,216,0.35); }
        50%      { box-shadow: 0 0 24px rgba(128,176,216,0.55), inset 0 0 0 1px rgba(128,176,216,0.6); }
      }
      @keyframes scanline {
        0%   { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.92; }
        51% { opacity: 0.85; }
        52% { opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInSlow {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes star-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50%      { opacity: 0.7; transform: scale(1.4); }
      }
      /* v21: alarm pulse for active violations HUD */
      @keyframes violation-pulse {
        0%, 100% {
          box-shadow: 0 0 18px rgba(255,80,60,0.30), 0 4px 14px rgba(0,0,0,0.5);
          border-color: rgba(255,100,80,0.50);
        }
        50% {
          box-shadow: 0 0 36px rgba(255,80,60,0.65), 0 4px 14px rgba(0,0,0,0.5);
          border-color: rgba(255,140,100,0.95);
        }
      }
      /* v21: round-transition banner, fade in, hold, fade out */
      @keyframes round-flash {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.86); }
        18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
        28%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
        78%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
      }
      .fade-in { animation: fadeIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }

      /* v22: mission-ops animations ─────────────────────────────── */
      @keyframes ops-blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0.35; }
      }
      @keyframes ops-scan {
        0%   { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes ops-ping {
        0%   { transform: scale(0.4); opacity: 0.85; }
        70%  { transform: scale(1.6); opacity: 0; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes ops-marquee {
        0%   { background-position: 0 0; }
        100% { background-position: 24px 0; }
      }
      /* v22: data readout, monospace tabular numerics, suitable for any
         numeric value where alignment matters (telemetry-style). */
      .ops-num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        font-weight: 500;
      }
      /* v22: a short tick label used in mission-ops panels above values */
      .ops-label {
        font-family: var(--sans);
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-mid);
      }
      /* v22: blueprint grid backdrop for the main app behind the map */
      .ops-grid-bg {
        background-image:
          linear-gradient(rgba(168,168,240,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(168,168,240,0.04) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      /* v22: corner brackets, adds tactical-display chrome to any panel */
      .ops-frame {
        position: relative;
      }
      .ops-frame::before,
      .ops-frame::after {
        content: "";
        position: absolute;
        width: 10px; height: 10px;
        border: 1.5px solid var(--periwinkle);
        opacity: 0.55;
      }
      .ops-frame::before {
        top: -1px; left: -1px;
        border-right: none; border-bottom: none;
      }
      .ops-frame::after {
        bottom: -1px; right: -1px;
        border-left: none; border-top: none;
      }

      /* ── Headings ──────────────────────────────────────────── */
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.005em;
      }

      /* ── Tooltip ───────────────────────────────────────────── */
      [title]:hover::after {
        content: attr(title);
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-soft);
        color: var(--text-hi);
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 10px;
        font-style: italic;
        letter-spacing: -0.005em;
        white-space: nowrap;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 400;
        z-index: 1000;
        box-shadow: 0 6px 20px rgba(0,0,0,0.55);
      }

      /* ── Text selection ────────────────────────────────────── */
      ::selection {
        background: rgba(168, 168, 240, 0.35);
        color: var(--text-hi);
      }
      ::-moz-selection {
        background: rgba(168, 168, 240, 0.35);
        color: var(--text-hi);
      }

      /* ── Focus indicators (keyboard accessibility) ─────────── */
      :focus-visible {
        outline: 2px solid var(--periwinkle);
        outline-offset: 2px;
        border-radius: 3px;
      }
      button:focus-visible {
        outline-offset: 3px;
      }
      input:focus-visible,
      select:focus-visible {
        outline: 1px solid var(--periwinkle);
        outline-offset: 1px;
      }

      /* ── Disabled state ─────────────────────────────────────── */
      button:disabled {
        cursor: not-allowed;
      }
      button:disabled:hover {
        filter: none;
      }
      /* v193: accessibility, honor the OS "reduce motion" setting. Safety-zone
         rings are already static (no marching-ants, no throb); this also calms
         the remaining ambient UI animations (turn glow, breach-alert pulse,
         twinkles) for anyone who has reduced motion enabled. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
